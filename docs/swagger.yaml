        type: integer
    type: object
  api.UpdateRoleRequest:
    properties:
      role:
        type: string
    type: object
  api.UpdateSiteRequest:
    properties:
      description:
        type: string
      name:
        type: string
    type: object
  api.UpdateTagRequest:
    properties:
      data_type:
        type: string
      description:
        type: string
      name:
        type: string
      unit:
        type: string
    type: object
  api.UpdateWidgetRequest:
    properties:
      device_id:
        type: string
      position_x:
        type: number
      position_y:
        type: number
      tag_name:
        type: string
      widget_type:
        type: string
    type: object
  api.UserInfo:
    properties:
      created_at:
