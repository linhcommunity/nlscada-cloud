  api.registerRequest:
    properties:
      email:
        type: string
      name:
        type: string
      password:
        type: string
    type: object
  api.registerResponse:
    properties:
      email:
        type: string
      message:
        description: Token    string    `json:"token"`
        type: string
      name:
        type: string
    type: object
  models.AlertLog:
    properties:
      acknowledged_at:
        type: string
      acknowledged_by:
        type: string
      created_at:
        type: string
      device_id:
        description: nullable cho cảnh báo cấp site
        type: string
      id:
        type: string
      message:
        type: string
      resolved_at:
        type: string
      severity:
        description: INFO, WARNING, CRITICAL
        type: string
      site_id:
        type: string
      status:
        description: ACTIVE, ACKNOWLEDGED, RESOLVED
        type: string
      tag_name:
        type: string
      threshold_value:
        type: number
      triggered_value:
        type: number
    type: object
  models.AlertRule:
    properties:
      created_at:
        type: string
      description:
        type: string
      id:
        type: string
      is_enabled:
        type: boolean
      max_value:
        type: number
      message_template:
        type: string
      min_value:
        type: number
      name:
        type: string
      severity:
        description: INFO, WARNING, CRITICAL
        type: string
      site_id:
        type: string
      tag_id:
        type: string
      updated_at:
        type: string
    type: object
  models.AuditLog:
    properties:
      action_type:
