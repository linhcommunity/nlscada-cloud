        type: string
      created_at:
        type: string
      description:
        type: string
      id:
        type: string
      ip_address:
        type: string
      new_values:
        description: JSONB
        type: object
      old_values:
        description: JSONB
        type: object
      resource_target:
        description: tên bảng
        type: string
      site_id:
        type: string
      target_id:
        type: string
      user_id:
        type: string
    type: object
  models.ControlConfig:
    properties:
      allowed_values:
        description: JSONB
        type: object
      control_type:
        description: ON_OFF, SET_VALUE, OPEN_CLOSE
        type: string
      created_at:
        type: string
      id:
        type: string
      is_enabled:
        type: boolean
      site_id:
        type: string
      tag_id:
        type: string
      updated_at:
        type: string
    type: object
  models.ControlLog:
    properties:
      acknowledged_at:
        type: string
      created_at:
        type: string
      device_id:
        type: string
      error_message:
        type: string
      id:
        type: string
      previous_value:
        type: string
      requested_value:
        type: string
      sent_at:
        type: string
      site_id:
        type: string
      status:
        description: PENDING, SENT, SUCCESS, FAILED, TIMEOUT
        type: string
      tag_name:
        type: string
      user_id:
        type: string
    type: object
  models.Device:
    properties:
      created_at:
        type: string
      device_type:
        type: string
      id:
        type: string
      last_heartbeat:
        type: string
      mqtt_client_id:
        type: string
      name:
        type: string
      site_id:
        type: string
      status:
        type: string
    type: object
  models.Membership:
    properties:
      created_at:
        type: string
      id:
        type: string
      role:
        type: string
      site_id:
        type: string
      user_id:
        type: string
    type: object
  models.PidDiagram:
    properties:
      background_url:
        type: string
      created_at:
        type: string
      id:
        type: string
      name:
        type: string
      site_id:
        type: string
      updated_at:
        type: string
    type: object
  models.PidWidget:
    properties:
      device_id:
        type: string
      diagram_id:
        type: string
      id:
        type: string
      position_x:
        type: number
      position_y:
        type: number
      tag_name:
        type: string
      widget_type:
        description: TEXT, PUMP, VALVE
        type: string
    type: object
  models.Site:
    properties:
      created_at:
        type: string
      description:
        type: string
      id:
        type: string
      name:
        type: string
    type: object
  models.SiteRetentionPolicy:
    properties:
      alert_logs_days:
        type: integer
      audit_logs_days:
        type: integer
      id:
        type: string
      site_id:
        type: string
      system_event_logs_days:
        type: integer
      telemetry_influx_days:
        type: integer
      updated_at:
        type: string
      updated_by:
        type: string
    type: object
  models.SystemEventLog:
    properties:
      created_at:
        type: string
      device_id:
        description: nullable nếu là lỗi toàn hệ thống
        type: string
      event_type:
        description: DEVICE_OFFLINE, GATEWAY_CONNECTED, FIRMWARE_UPDATE_START
        type: string
      id:
        type: string
      message:
        type: string
      severity_level:
        description: INFO, WARNING, ERROR
        type: string
      site_id:
        type: string
    type: object
  models.Tag:
    properties:
      created_at:
        type: string
      data_type:
        type: string
      description:
        type: string
      device_id:
        type: string
      id:
        type: string
      name:
        type: string
      unit:
        type: string
    type: object
  response.ErrorPayload:
    properties:
      code:
        type: string
      details:
        items:
          $ref: '#/definitions/response.ValidationErrorDetail'
        type: array
      message:
        type: string
      timestamp:
        type: string
    type: object
  response.ErrorResponse:
    properties:
      error:
        $ref: '#/definitions/response.ErrorPayload'
      success:
        type: boolean
    type: object
  response.Meta:
    properties:
      pagination:
        allOf:
        - $ref: '#/definitions/response.Pagination'
        description: Chỉ xuất hiện khi có phân trang, nếu không có sẽ tự động ẩn đi
      timestamp:
        type: string
    type: object
  response.Pagination:
    properties:
      limit:
        type: integer
      page:
        type: integer
      total_items:
        type: integer
      total_pages:
        type: integer
    type: object
  response.SuccessResponse:
    properties:
      data: {}
      meta:
        $ref: '#/definitions/response.Meta'
      success:
        type: boolean
    type: object
  response.ValidationErrorDetail:
    properties:
      field:
        type: string
      issue:
        type: string
    type: object
host: localhost:8080
info:
  contact:
    name: Linh Community
    url: https://github.com/linhcommunity/nlscada-cloud
  description: Backend API for NL SCADA Cloud
  title: NL SCADA Center API
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: Xác thực người dùng và trả về JWT token
      parameters:
      - description: Thông tin đăng nhập
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.loginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Đăng nhập thành công
          schema:
            allOf:
            - $ref: '#/definitions/response.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/api.loginResponse'
              type: object
        "400":
          description: Lỗi dữ liệu
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Tài khoản hoặc mật khẩu không chính xác
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Đăng nhập
      tags:
      - Auth
  /auth/logout:
    post:
      consumes:
      - application/json
      description: Xóa cookie session_token để đăng xuất người dùng
      produces:
      - application/json
      responses:
        "200":
          description: Đăng xuất thành công
          schema:
            $ref: '#/definitions/response.SuccessResponse'
        "405":
          description: Phương thức không được hỗ trợ
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Đăng xuất
      tags:
      - Auth
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: Tạo token mới dựa trên refresh token (ở đây dùng cookie session_token)
      produces:
      - application/json
      responses:
        "200":
          description: Làm mới token thành công
          schema:
            allOf:
            - $ref: '#/definitions/response.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/api.loginResponse'
              type: object
        "401":
          description: Phiên đăng nhập không hợp lệ hoặc đã hết hạn
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Làm mới token
      tags:
      - Auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Tạo người dùng mới. Không tạo site hay membership.
      parameters:
      - description: Thông tin đăng ký
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.registerRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Đăng ký thành công
          schema:
            allOf:
            - $ref: '#/definitions/response.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/api.registerResponse'
              type: object
        "400":
          description: Lỗi dữ liệu
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "409":
          description: Email đã tồn tại
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Đăng ký
      tags:
      - Auth
  /sites:
    get:
      description: Trả về tất cả site mà user hiện tại là thành viên, kèm role
      produces:
      - application/json
      responses:
        "200":
          description: Danh sách site
          schema:
            allOf:
            - $ref: '#/definitions/response.SuccessResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/models.Site'
                  type: array
              type: object
        "401":
          description: Chưa đăng nhập
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Danh sách site của user
      tags:
      - Sites
    post:
      consumes:
      - application/json
      description: Tạo site mới và user hiện tại trở thành admin của site đó
      parameters:
      - description: Tên site
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.CreateSiteRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Site đã tạo
          schema:
            allOf:
            - $ref: '#/definitions/response.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/models.Site'
              type: object
        "400":
          description: Dữ liệu không hợp lệ
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Tạo site mới
      tags:
      - Sites
  /sites/{siteID}/:
    delete:
      parameters:
      - description: Site UUID
        in: path
        name: siteID
        required: true
        type: string
      responses:
        "200":
          description: Site đã xóa
          schema:
            $ref: '#/definitions/response.SuccessResponse'
        "403":
          description: Không có quyền admin
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Xóa site
      tags:
      - Sites
    get:
      parameters:
      - description: Site UUID
        in: path
        name: siteID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Thông tin site
          schema:
            allOf:
            - $ref: '#/definitions/response.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/models.Site'
              type: object
        "404":
          description: Không tìm thấy
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Chi tiết site
      tags:
      - Sites
    put:
      consumes:
      - application/json
      parameters:
      - description: Site UUID
        in: path
        name: siteID
        required: true
        type: string
      - description: Tên mới
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.UpdateSiteRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Site đã cập nhật
          schema:
            allOf:
            - $ref: '#/definitions/response.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/models.Site'
              type: object
        "403":
          description: Không có quyền admin
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Cập nhật site
      tags:
      - Sites
  /sites/{siteID}/alert-rules:
    get:
      parameters:
      - description: Site UUID
        in: path
        name: siteID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Danh sách rule
          schema:
            allOf:
            - $ref: '#/definitions/response.SuccessResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/models.AlertRule'
                  type: array
              type: object
      security:
      - BearerAuth: []
      summary: Danh sách alert rules
      tags:
      - Alert Rules
    post:
      consumes:
      - application/json
      parameters:
      - description: Site UUID
        in: path
        name: siteID
        required: true
        type: string
      - description: Thông tin rule
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.CreateAlertRuleRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Rule đã tạo
          schema:
            allOf:
            - $ref: '#/definitions/response.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/models.AlertRule'
              type: object
        "400":
          description: Dữ liệu không hợp lệ
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Tạo alert rule
      tags:
      - Alert Rules
  /sites/{siteID}/alert-rules/{ruleID}:
    delete:
      parameters:
      - description: Site UUID
        in: path
        name: siteID
        required: true
        type: string
      - description: Rule UUID
        in: path
        name: ruleID
        required: true
        type: string
      responses:
        "200":
          description: Rule đã xóa
          schema:
            $ref: '#/definitions/response.SuccessResponse'
      security:
      - BearerAuth: []
      summary: Xóa alert rule
      tags:
      - Alert Rules
    get:
      parameters:
      - description: Site UUID
        in: path
        name: siteID
        required: true
        type: string
      - description: Rule UUID
        in: path
        name: ruleID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/models.AlertRule'
              type: object
        "404":
          description: Rule không tồn tại
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Chi tiết alert rule
      tags:
      - Alert Rules
    put:
      consumes:
      - application/json
      parameters:
      - description: Site UUID
        in: path
        name: siteID
        required: true
        type: string
      - description: Rule UUID
        in: path
        name: ruleID
        required: true
        type: string
      - description: Các trường cần cập nhật
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.UpdateAlertRuleRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Rule đã cập nhật
          schema:
            allOf:
            - $ref: '#/definitions/response.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/models.AlertRule'
              type: object
        "400":
          description: Không có gì để cập nhật
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Cập nhật alert rule
      tags:
      - Alert Rules
  /sites/{siteID}/alerts:
    get:
      parameters:
      - description: Site UUID
        in: path
        name: siteID
        required: true
        type: string
      - description: ACTIVE, ACKNOWLEDGED, RESOLVED
        in: query
        name: status
        type: string
      - description: INFO, WARNING, CRITICAL
        in: query
        name: severity
        type: string
      - description: Lọc theo device UUID
        in: query
        name: device_id
        type: string
      - description: Số trang
        in: query
        name: page
        type: integer
      - description: Số bản ghi/trang
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Danh sách cảnh báo
          schema:
            allOf:
            - $ref: '#/definitions/response.SuccessResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/models.AlertLog'
                  type: array
              type: object
      security:
      - BearerAuth: []
      summary: Danh sách cảnh báo
      tags:
      - Alerts
    post:
      consumes:
      - application/json
      parameters:
      - description: Site UUID
        in: path
        name: siteID
        required: true
        type: string
      - description: Thông tin cảnh báo
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.CreateAlertRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Cảnh báo đã tạo
          schema:
            allOf:
            - $ref: '#/definitions/response.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/models.AlertLog'
              type: object
        "400":
          description: Dữ liệu không hợp lệ
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Tạo cảnh báo thủ công
      tags:
      - Alerts
  /sites/{siteID}/alerts/{alertID}:
    delete:
      parameters:
      - description: Site UUID
