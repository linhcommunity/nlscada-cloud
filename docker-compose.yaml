version: '3.9'

services:
  emqx:
    image: emqx/emqx:5.7.2
    container_name: nlscada-emqx
    restart: unless-stopped
    environment:
      - EMQX_NODE_NAME=emqx@node1
      - EMQX_DASHBOARD__DEFAULT_USERNAME=admin
      - EMQX_DASHBOARD__DEFAULT_PASSWORD=Admin@123
    ports:
      - "1883:1883"
      - "8883:8883"
      - "18083:18083"
    volumes:
      - emqx_data:/opt/emqx/data
      - ./backend/configs/emqx/acl.conf:/opt/emqx/etc/acl.conf
    networks:
      - nlscada-net
    healthcheck:
      test: ["CMD", "emqx", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16-alpine
    container_name: nlscada-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: nlscada
      POSTGRES_USER: nlscada
      POSTGRES_PASSWORD: Nlscada@2025
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/scripts/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql
    networks:
      - nlscada-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nlscada -d nlscada"]
      interval: 10s
      timeout: 5s
      retries: 5

  influxdb:
    image: influxdb:2.7-alpine
    container_name: nlscada-influxdb
    restart: unless-stopped
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: Influx@2025
      DOCKER_INFLUXDB_INIT_ORG: nlscada
      DOCKER_INFLUXDB_INIT_BUCKET: nlscada_metrics
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: my-super-secret-token
    ports:
      - "8086:8086"
    volumes:
      - influxdb_data:/var/lib/influxdb2
      - influxdb_conf:/etc/influxdb2
    networks:
      - nlscada-net
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: nlscada-core
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=postgres://nlscada:Nlscada@2025@postgres:5432/nlscada?sslmode=disable
      - INFLUXDB_URL=http://influxdb:8086
      - INFLUXDB_TOKEN=my-super-secret-token
      - MQTT_BROKER=tcp://emqx:1883
      - MQTT_USER=core-service
      - MQTT_PASS=CoreService@2025
      - JWT_SECRET=dev-secret-change-me
    depends_on:
      postgres:
        condition: service_healthy
      influxdb:
        condition: service_healthy
      emqx:
        condition: service_healthy
    networks:
      - nlscada-net
      
  frontend:
    build: ./frontend
    container_name: nlscada-webbase
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - nlscada-net

volumes:
  emqx_data:
  pgdata:
  influxdb_data:
  influxdb_conf:

networks:
  nlscada-net:
    driver: bridge